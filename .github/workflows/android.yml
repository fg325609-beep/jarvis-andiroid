name: Build Jarvis APK
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
 
      # Android SDK runner'da oldindan o'rnatilgan ($ANDROID_HOME) — setup-android shart emas
      - name: Android SDK tekshiruvi
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
 
      - name: Gradle 8.11.1
        run: |
          curl -sSfL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
 
      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace
 
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 